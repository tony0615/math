<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 圆形邮戳外框 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4CAF50" stroke-width="5"/>
  
  <!-- 圆形边框装饰 -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- 文字：已打卡 -->
  <text x="50%" y="50%" text-anchor="middle" font-size="48" fill="#4CAF50" transform="rotate(-15 100,100)" dy=".3em">已打卡</text>
  
  <!-- 勾选图标 -->
  <circle cx="100" cy="100" r="15" fill="#4CAF50"/>
  <text x="100" y="100" text-anchor="middle" font-size="18" fill="white" dy=".3em">✔</text>
</svg>
